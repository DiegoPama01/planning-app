<div class="callback-shell flex min-h-svh items-center justify-center p-6 md:p-10">
  <div class="callback-panel rounded-2xl border bg-card p-8 text-center shadow-sm">
    @if (errorMessage(); as error) {
      <h1 class="text-xl font-semibold tracking-tight">Login failed</h1>
      <p class="mt-3 text-sm text-muted-foreground">{{ error }}</p>
      <a class="mt-6 inline-flex text-sm underline-offset-4 hover:underline" routerLink="/login">Back to login</a>
    } @else {
      <h1 class="text-xl font-semibold tracking-tight">Signing you in</h1>
      <p class="mt-3 text-sm text-muted-foreground">Completing the Authentik session...</p>
    }
  </div>
</div>
