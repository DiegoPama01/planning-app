<hlm-card>
  <div hlmCardContent class="pt-6">
    <form [formRoot]="positionForm">
      <hlm-field-group class="space-y-6">
        <hlm-field>
          <label hlmFieldLabel for="position-name">Name</label>
          <input hlmInput id="position-name" type="text" placeholder="Cashier" [formField]="positionForm.name" />
          @for (error of positionForm.name().errors(); track error) {
            <hlm-field-error [validator]="error.kind">{{ error.message }}</hlm-field-error>
          }
        </hlm-field>

        <hlm-field>
          <label hlmFieldLabel for="position-color">Color</label>
          <div class="flex items-center gap-3">
            <input hlmInput id="position-color" type="color" class="h-11 w-16 shrink-0 p-1" [formField]="positionForm.color" />
            <code class="text-muted-foreground text-sm">{{ positionForm.color().value() }}</code>
          </div>
          @for (error of positionForm.color().errors(); track error) {
            <hlm-field-error [validator]="error.kind">{{ error.message }}</hlm-field-error>
          }
        </hlm-field>

        @if (formError(); as errorMessage) {
          <p class="text-sm font-medium text-red-600" aria-live="polite">{{ errorMessage }}</p>
        }

        <div class="flex flex-col-reverse gap-3 sm:flex-row sm:justify-end">
          <button hlmBtn type="button" variant="outline" (click)="cancel()" [disabled]="positionForm().submitting()">
            Cancel
          </button>
          <button hlmBtn type="submit" [disabled]="positionForm().submitting()">
            {{ submitLabel() }}
          </button>
        </div>
      </hlm-field-group>
    </form>
  </div>
</hlm-card>
