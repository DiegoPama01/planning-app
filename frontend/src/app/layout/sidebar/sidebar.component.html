<div hlmSidebarWrapper class="flex min-h-svh flex-col pt-(--header-height)">
  <ng-content select="[header]" />
  <div class="flex flex-1">
    <hlm-sidebar
      sidebarContainerClass="top-(--header-height) h-[calc(100svh-var(--header-height))]"
    >
      <hlm-sidebar-header>
        <ul hlmSidebarMenu>
          <li hlmSidebarMenuItem>
            <button
              hlmSidebarMenuButton
              size="lg"
              type="button"
              [hlmDropdownMenuTrigger]="companyMenu"
            >
              <div
                class="bg-sidebar-primary text-sidebar-primary-foreground flex aspect-square size-8 items-center justify-center rounded-lg"
              >
                <ng-icon name="lucideCommand" class="text-base" />
              </div>
              <div class="grid flex-1 text-left text-sm leading-tight">
                <span class="truncate font-medium">{{ companyName() }}</span>
                <span class="truncate text-xs">{{ companyPlan() }}</span>
              </div>
              <ng-icon name="lucideChevronsUpDown" class="ml-auto text-base" />
            </button>
          </li>
        </ul>
      </hlm-sidebar-header>

      <hlm-sidebar-content>
        <spartan-nav-main [items]="data.navMain" />
      </hlm-sidebar-content>
      <hlm-sidebar-footer>
        <spartan-nav-user [user]="user()" (logoutRequested)="requestLogout()" />
      </hlm-sidebar-footer>
    </hlm-sidebar>
    <ng-content />
  </div>
</div>

<ng-template #companyMenu>
  <hlm-dropdown-menu class="min-w-64 rounded-lg">
    <hlm-dropdown-menu-label>Switch company</hlm-dropdown-menu-label>
    <hlm-dropdown-menu-separator />
    @for (company of companies(); track company.id) {
      <button hlmDropdownMenuItem type="button" (click)="selectCompany(company.id)">
        <div class="grid flex-1 text-left text-sm leading-tight">
          <span class="truncate font-medium">{{ company.name }}</span>
          <span class="text-muted-foreground truncate text-xs">{{ company.role }}</span>
        </div>
        @if (company.id === activeCompanyId()) {
          <ng-icon name="lucideCheck" class="ml-2 text-base" />
        }
      </button>
    }
  </hlm-dropdown-menu>
</ng-template>
