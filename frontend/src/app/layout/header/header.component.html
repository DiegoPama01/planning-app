<header class="bg-background fixed inset-x-0 top-0 z-50 flex w-full items-center border-b">
  <div class="flex h-(--header-height) w-full items-center gap-2 px-4">
    <button hlmSidebarTrigger></button>
    <hlm-separator orientation="vertical" class="mr-2" />
    <nav hlmBreadcrumb class="hidden sm:block">
      <ol hlmBreadcrumbList>
        @for (breadcrumb of breadcrumbs(); track breadcrumb.url; let last = $last) {
          <li hlmBreadcrumbItem>
            @if (last) {
              <a hlmBreadcrumbPage>{{ breadcrumb.label }}</a>
            } @else {
              <a hlmBreadcrumbLink [routerLink]="breadcrumb.url">{{ breadcrumb.label }}</a>
            }
          </li>

          @if (!last) {
            <li hlmBreadcrumbSeparator></li>
          }
        }
      </ol>
    </nav>

    <div hlmInputGroup class="w-full sm:ml-auto sm:w-auto">
      <input hlmInputGroupInput placeholder="Type to search..." />
      <div hlmInputGroupAddon>
        <ng-icon name="lucideSearch" />
      </div>
    </div>
  </div>
</header>
