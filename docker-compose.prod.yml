services:
  postgres:
    image: postgres:17-alpine
    container_name: planning-app-postgres-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: planning-app-backend-prod
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=5&conn_max_age=300
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        FRONTEND_PUBLIC_API_BASE_URL: ${FRONTEND_PUBLIC_API_BASE_URL}
        FRONTEND_PUBLIC_AUTH_ENABLED: ${FRONTEND_PUBLIC_AUTH_ENABLED}
        FRONTEND_PUBLIC_AUTH_ISSUER_URL: ${FRONTEND_PUBLIC_AUTH_ISSUER_URL}
        FRONTEND_PUBLIC_AUTH_CLIENT_ID: ${FRONTEND_PUBLIC_AUTH_CLIENT_ID}
        FRONTEND_PUBLIC_AUTH_REDIRECT_URI: ${FRONTEND_PUBLIC_AUTH_REDIRECT_URI}
        FRONTEND_PUBLIC_AUTH_POST_LOGOUT_REDIRECT_URI: ${FRONTEND_PUBLIC_AUTH_POST_LOGOUT_REDIRECT_URI}
        FRONTEND_PUBLIC_AUTH_SCOPES: ${FRONTEND_PUBLIC_AUTH_SCOPES}
        FRONTEND_PUBLIC_AUTH_RESPONSE_TYPE: ${FRONTEND_PUBLIC_AUTH_RESPONSE_TYPE}
    container_name: planning-app-frontend-prod
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_prod_data:
