services:
  postgres:
    image: postgres:17-alpine
    container_name: planning-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-planning_app}
      POSTGRES_USER: ${POSTGRES_USER:-planning_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-planning_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_local_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-planning_user} -d ${POSTGRES_DB:-planning_app}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: planning-app-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      DATABASE_URL: postgresql://${POSTGRES_USER:-planning_user}:${POSTGRES_PASSWORD:-planning_password}@postgres:5432/${POSTGRES_DB:-planning_app}?sslmode=disable&connect_timeout=5&conn_max_age=60
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: planning-app-frontend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      FRONTEND_PUBLIC_API_BASE_URL: http://localhost:8000/api
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_local_data:
