services:
  backend:
    build:
      context: ./backend
    container_name: planning-app-backend
    env_file:
      - .env
    environment:
      # PostgreSQL is reached through the SSH tunnel on the host machine.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@host.docker.internal:5432/${POSTGRES_DB}?sslmode=disable&connect_timeout=5&conn_max_age=60
      POSTGRES_HOST: host.docker.internal
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
